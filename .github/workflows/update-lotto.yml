# 매주 토요일 로또 추첨 결과를 받아 src/data/lotto/draws.json에 커밋합니다.
# main에 커밋되면 Cloudflare Workers Builds가 자동으로 다시 배포합니다.
name: Update lotto results

on:
  schedule:
    - cron: "0 22 * * 6" # 일요일 07:00 (한국 시간)
    - cron: "0 3 * * 0" # 일요일 12:00 (한국 시간) — 아침에 자료가 아직 없을 때 다시 시도
    - cron: "0 0 * * 1" # 월요일 09:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch new draws
        run: node scripts/update-lotto.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/lotto/draws.json; then
            echo "No new draws."
            exit 0
          fi
          latest=$(node -e 'const d=require("./src/data/lotto/draws.json");console.log(d.at(-1).no)')
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data/lotto/draws.json
          git commit -m "로또 ${latest}회 당첨 결과 반영"
          git push
