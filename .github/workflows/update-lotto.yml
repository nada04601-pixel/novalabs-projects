# 매주 토요일 로또 추첨 결과(draws.json)와 1등 배출점(stores.json)을 받아 커밋합니다.
# main에 커밋되면 Cloudflare Workers Builds가 자동으로 다시 배포합니다.
name: Update lotto results

on:
  schedule:
    - cron: "0 22 * * 6" # 일요일 07:00 (한국 시간)
    - cron: "0 3 * * 0" # 일요일 12:00 (한국 시간) — 아침에 자료가 아직 없을 때 다시 시도
    - cron: "0 0 * * 1" # 월요일 09:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch new draws
        run: node scripts/update-lotto.mjs
      # 동행복권 서버는 해외 접속이 자주 끊기므로, 실패해도 당첨번호는 커밋하고 다음 실행 때 다시 받습니다.
      - name: Fetch winning stores
        continue-on-error: true
        run: node scripts/update-lotto-stores.mjs --minutes 15
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/lotto/; then
            echo "No changes."
            exit 0
          fi
          latest=$(node -e 'const d=require("./src/data/lotto/draws.json");console.log(d.at(-1).no)')
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data/lotto/
          git commit -m "로또 ${latest}회 당첨 결과·1등 배출점 반영"
          git push
