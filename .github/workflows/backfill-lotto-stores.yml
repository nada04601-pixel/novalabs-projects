# 임시: 지난 회차 1등 배출점 좌표를 채워 작업 브랜치에 커밋합니다 (채운 뒤 삭제)
name: Backfill lotto stores
on:
  push:
    branches: [claude/kind-meitner-wkzm8d]
    paths: [.github/workflows/backfill-lotto-stores.yml, scripts/update-lotto-stores.mjs]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/update-lotto-stores.mjs --minutes 100
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data/lotto/stores.json
          git diff --cached --quiet && exit 0
          git commit -m "로또 1등 배출점 좌표 채우기"
          git pull --rebase origin claude/kind-meitner-wkzm8d
          git push origin HEAD:claude/kind-meitner-wkzm8d
