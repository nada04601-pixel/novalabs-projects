# 임시: GitHub Actions에서 동행복권 당첨 판매점 페이지에 접속되는지 확인 (확인 후 삭제)
name: Probe dhlottery
on:
  push:
    branches: [claude/kind-meitner-wkzm8d]
    paths: [.github/workflows/probe-dhlottery.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          B=https://www.dhlottery.co.kr
          get() { for i in 1 2 3 4; do curl -sS -L -m 40 -A "$UA" -c jar -b jar "$@" && return 0; echo "retry $i" >&2; sleep 10; done; return 1; }
          get -o w.html $B/wnprchsplcsrch/home
          echo "--- 탭 값"; grep -n -E "tagTab|map-tab-li" w.html | head -20
          echo "--- sendHttpJson 정의"
          get -s "$B/common/cmmUtil.js?v=20261006" > cmm.js
          grep -n -A40 "sendHttpJson" cmm.js | head -90
          grep -n -i -E "csrf|X-Requested|AJAX|header" cmm.js | head -20
          grep -n -i -E "csrf" w.html | head
          call() { echo "=== $1"; get -s -X POST "$B/wnprchsplcsrch/selectLtWnShp.do" -H "Content-Type: application/json;charset=UTF-8" -H "X-Requested-With: XMLHttpRequest" -H "Referer: $B/wnprchsplcsrch/home" -d "$1" | head -c 2500; echo; }
          call '{"srchWnShpRnk":"1","srchLtEpsd":"1245","srchShpLctn":""}'
          call '{"srchWnShpRnk":"all","srchLtEpsd":"1245","srchShpLctn":""}'
          call '{"srchWnShpRnk":"rank1","srchLtEpsd":"1245","srchShpLctn":""}'
          call '{"srchWnShpRnk":"1","srchLtEpsd":"262","srchShpLctn":""}'
          call '{"srchWnShpRnk":"1","srchLtEpsd":"1","srchShpLctn":""}'
          echo "=== 회차 정보"; get -s -X POST "$B/lt645/selectLtEpsdInfo.do" -H "Content-Type: application/json;charset=UTF-8" -H "X-Requested-With: XMLHttpRequest" -d '{}' | head -c 600; echo
