# 임시: GitHub Actions에서 동행복권 당첨 판매점 페이지에 접속되는지 확인 (확인 후 삭제)
name: Probe dhlottery
on:
  push:
    branches: [claude/kind-meitner-wkzm8d]
    paths: [.github/workflows/probe-dhlottery.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sS -L -m 30 -A "$UA" -c jar -b jar -o home.html https://www.dhlottery.co.kr/
          echo "--- 메뉴 링크(당첨/판매점/로또 관련)"
          grep -o -E 'href="[^"]*"' home.html | sort -u | grep -i -E "store|shop|win|prchs|plc|lt645|lotto|result|rslt|645" | head -80
          echo "--- 메뉴 텍스트 주변"
          grep -n -E "배출점|당첨판매점|판매점" home.html | head -40
          echo "--- 스크립트 파일"
          grep -o -E 'src="[^"]*\.js[^"]*"' home.html | sort -u | head -40
          echo "--- ajax/fetch url"
          grep -n -o -E "(url|fetch)\s*[:(]\s*['\"][^'\"]+['\"]" home.html | sort -u | head -60
