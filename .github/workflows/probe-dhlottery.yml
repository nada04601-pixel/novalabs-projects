# 임시: GitHub Actions에서 동행복권 당첨 판매점 페이지에 접속되는지 확인 (확인 후 삭제)
name: Probe dhlottery
on:
  push:
    branches: [claude/kind-meitner-wkzm8d]
    paths: [.github/workflows/probe-dhlottery.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          B=https://www.dhlottery.co.kr
          get() { for i in 1 2 3 4 5 6 7 8; do curl -sS -L --connect-timeout 15 -m 40 -A "$UA" -c jar -b jar "$@" && return 0; echo "retry $i" >&2; sleep 10; done; return 1; }
          get -o w.html $B/wnprchsplcsrch/home
          H=(-H "AJAX: true" -H "requestMenuUri: /wnprchsplcsrch/home" -H "X-Requested-With: XMLHttpRequest" -H "Referer: $B/wnprchsplcsrch/home" -H "Accept: application/json")
          call() { echo "=== $1"; get -s -G "$B/wnprchsplcsrch/selectLtWnShp.do" "${H[@]}" $2 | head -c 3000; echo; }
          call "1245 rank1" "--data-urlencode srchWnShpRnk=1 --data-urlencode srchLtEpsd=1245 --data-urlencode srchShpLctn="
          call "1245 all" "--data-urlencode srchWnShpRnk=all --data-urlencode srchLtEpsd=1245 --data-urlencode srchShpLctn="
          call "600 rank1" "--data-urlencode srchWnShpRnk=1 --data-urlencode srchLtEpsd=600 --data-urlencode srchShpLctn="
          call "262 rank1" "--data-urlencode srchWnShpRnk=1 --data-urlencode srchLtEpsd=262 --data-urlencode srchShpLctn="
          call "1 rank1" "--data-urlencode srchWnShpRnk=1 --data-urlencode srchLtEpsd=1 --data-urlencode srchShpLctn="
          echo "=== 회차 정보"; get -s -G "$B/lt645/selectLtEpsdInfo.do" "${H[@]}" | head -c 800; echo
          echo "=== 건수"; get -s -G "$B/wnprchsplcsrch/selectLtWnShpCnt.do" "${H[@]}" --data-urlencode srchLtEpsd=1245 | head -c 800; echo
