# 임시: GitHub Actions에서 동행복권 당첨 판매점 페이지에 접속되는지 확인 (확인 후 삭제)
name: Probe dhlottery
on:
  push:
    branches: [claude/kind-meitner-wkzm8d]
    paths: [.github/workflows/probe-dhlottery.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get() { for i in 1 2 3 4; do curl -sS -L -m 40 -A "$UA" -c jar -b jar "$@" && return 0; echo "retry $i" >&2; sleep 10; done; return 1; }
          get -o w.html https://www.dhlottery.co.kr/wnprchsplcsrch/home
          wc -c w.html
          echo "--- 주소/요청 관련 줄"
          grep -n -E "wnprchsplcsrch|ajax|url\s*:|fetch\(|\.do|/api|srch|Epsd|drwNo|ltEpsd|shp|Shp" w.html | grep -v -E "^\s*$" | head -120
          echo "--- 페이지 전용 스크립트"
          for s in $(grep -o -E 'src="[^"]*\.js[^"]*"' w.html | sed 's/src="//;s/"$//' | grep -v -E "jquery|swiper|rsa|moment|xlsx|common/(cmmUtil|fileUtil|gmUtil|msgUtil)|resources/js/common"); do
            echo "=== $s"; get -s "https://www.dhlottery.co.kr$s" | grep -n -E "url|ajax|fetch|wnprchs" | head -60
          done
