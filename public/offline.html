<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인터넷 연결 없음 | 노바랩 공작소</title>
<style>
:root{--bg:#fff;--fg:#0f172a;--mut:#64748b;--card:#f1f5f9;--acc:#4f46e5;--accfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e8ecf5;--mut:#94a3b8;--card:#141b30;--acc:#818cf8;--accfg:#0b1020}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7;word-break:keep-all}
main{max-width:420px;margin:16px;padding:28px 24px;background:var(--card);border-radius:16px;text-align:center}
h1{font-size:22px;margin:12px 0 8px}
p{color:var(--mut);margin:0 0 20px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:var(--acc);color:var(--accfg);cursor:pointer}
</style>
</head>
<body>
<main>
<img src="/icons/icon-192.png" width="64" height="64" alt="">
<h1>인터넷에 연결되어 있지 않아요</h1>
<p>노바랩 공작소는 계산할 때 인터넷이 필요하지 않지만, 처음 여는 페이지는 받아와야 합니다. 연결을 확인한 뒤 다시 시도해 주세요. 전에 열어 본 계산기는 연결 없이도 열릴 수 있습니다.</p>
<button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
